<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="3550" viewBox="0 0 2400 3550" role="img" aria-labelledby="title description">
  <title id="title">FurniCraft Admin Flowchart</title>
  <desc id="description">Admin access, dashboard, reservation review and management, and supporting catalog, customer, reporting, privacy, and API usage tasks.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L12 6 L0 12z" fill="#38291f"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#211a16}.title{font-size:44px;font-weight:700;letter-spacing:.4px}.subtitle{font-size:25px;fill:#635347}.node{fill:#fffdfa;stroke:#755238;stroke-width:3}.decision{fill:#fff7eb;stroke:#755238;stroke-width:3}.terminal{fill:#f7e9d9;stroke:#755238;stroke-width:3}.nodeText{font-size:23px;text-anchor:middle;dominant-baseline:middle}.small{font-size:20px;text-anchor:middle;dominant-baseline:middle}.branch{font-size:19px;font-weight:700;fill:#65442e}.connector{fill:none;stroke:#38291f;stroke-width:3;marker-end:url(#arrow)}.rail{fill:none;stroke:#8b745f;stroke-width:3}.card{fill:#fbf6ef;stroke:#b4997f;stroke-width:2.5}.cardTitle{font-size:25px;font-weight:700;fill:#65442e}.cardText{font-size:20px;fill:#29211c}.note{font-size:19px;text-anchor:middle;fill:#574a40}
    </style>
  </defs>
  <rect width="2400" height="3550" fill="#fff"/>
  <text class="title" x="1200" y="62" text-anchor="middle">FURNICRAFT ADMIN FLOWCHART</text>
  <text class="subtitle" x="1200" y="105" text-anchor="middle">Administrator access, reservation review, and system management</text>

  <!-- Admin access and dashboard -->
  <ellipse class="terminal" cx="800" cy="172" rx="118" ry="45"/>
  <text class="nodeText" x="800" y="172">START</text>
  <path class="connector" d="M800 217 V270"/>
  <rect class="node" x="470" y="272" width="660" height="96" rx="4"/>
  <text class="nodeText" x="800" y="320"><tspan x="800" dy="-12">Administrator opens FurniCraft</tspan><tspan x="800" dy="30">and signs in.</tspan></text>
  <path class="connector" d="M800 368 V415"/>
  <polygon class="decision" points="800,418 1035,490 800,562 565,490"/>
  <text class="nodeText" x="800" y="490">Is the account an active admin?</text>
  <text class="branch" x="820" y="593">YES</text>
  <path class="connector" d="M800 562 V625"/>
  <text class="branch" x="545" y="478" text-anchor="end">NO</text>
  <path class="connector" d="M565 490 H440"/>
  <rect class="node" x="85" y="432" width="350" height="116" rx="4"/>
  <text class="small" x="260" y="490"><tspan x="260" dy="-15">Access is denied;</tspan><tspan x="260" dy="30">admin pages stay protected.</tspan></text>
  <path class="connector" d="M260 548 V620"/>
  <ellipse class="terminal" cx="260" cy="665" rx="90" ry="38"/>
  <text class="nodeText" x="260" y="665">END</text>

  <rect class="node" x="470" y="627" width="660" height="100" rx="4"/>
  <text class="nodeText" x="800" y="677"><tspan x="800" dy="-14">Admin dashboard shows system totals,</tspan><tspan x="800" dy="30">recent reservations, and active furniture.</tspan></text>
  <path class="connector" d="M800 727 V780"/>
  <rect class="node" x="470" y="782" width="660" height="100" rx="4"/>
  <text class="nodeText" x="800" y="832"><tspan x="800" dy="-14">Choose Reservations to review requests</tspan><tspan x="800" dy="30">or open another admin section.</tspan></text>

  <!-- Other admin sections branch from the menu -->
  <path class="rail" d="M1130 832 H1430 V2880"/>
  <path class="connector" d="M1430 1090 H1448"/>
  <path class="connector" d="M1430 1530 H1448"/>
  <path class="connector" d="M1430 1930 H1448"/>
  <path class="connector" d="M1430 2370 H1448"/>
  <path class="connector" d="M1430 2760 H1448"/>
  <text class="branch" x="1160" y="812">OTHER SECTIONS</text>

  <!-- Main reservation workflow -->
  <text class="branch" x="820" y="912">RESERVATIONS</text>
  <path class="connector" d="M800 882 V925"/>
  <rect class="node" x="420" y="927" width="760" height="132" rx="4"/>
  <text class="nodeText" x="800" y="993"><tspan x="800" dy="-31">Open reservations; filter by status and review</tspan><tspan x="800" dy="30">customer, item, visit time, notes, and preview</tspan><tspan x="800" dy="30">when one is available.</tspan></text>
  <path class="connector" d="M800 1059 V1102"/>
  <polygon class="decision" points="800,1105 1035,1175 800,1245 565,1175"/>
  <text class="nodeText" x="800" y="1175">Is this request pending?</text>
  <text class="branch" x="820" y="1272">YES</text>
  <path class="connector" d="M800 1245 V1304"/>
  <text class="branch" x="1056" y="1163">NO</text>
  <path class="connector" d="M1035 1175 H1155"/>
  <rect class="card" x="1200" y="1119" width="205" height="112" rx="7"/>
  <text class="small" x="1302" y="1175"><tspan x="1302" dy="-15">Review confirmed</tspan><tspan x="1302" dy="29">or closed request.</tspan></text>
  <path class="connector" d="M1405 1175 H1410 V2239 H1182"/>

  <polygon class="decision" points="800,1307 1035,1377 800,1447 565,1377"/>
  <text class="nodeText" x="800" y="1377">Approve the reservation?</text>
  <text class="branch" x="820" y="1475">YES</text>
  <path class="connector" d="M800 1447 V1504"/>
  <text class="branch" x="1056" y="1365">NO</text>
  <path class="connector" d="M1035 1377 H1198"/>
  <rect class="card" x="1200" y="1317" width="205" height="126" rx="7"/>
  <text class="small" x="1302" y="1380"><tspan x="1302" dy="-30">Enter decline</tspan><tspan x="1302" dy="28">reason; save</tspan><tspan x="1302" dy="28">DECLINED.</tspan></text>
  <path class="connector" d="M1302 1443 V1494"/>
  <rect class="card" x="1200" y="1496" width="205" height="82" rx="7"/>
  <text class="small" x="1302" y="1537">Customer is notified.</text>
  <path class="connector" d="M1405 1537 H1410 V2239 H1182"/>

  <rect class="node" x="420" y="1506" width="760" height="112" rx="4"/>
  <text class="nodeText" x="800" y="1562"><tspan x="800" dy="-15">Save as CONFIRMED (request approved);</tspan><tspan x="800" dy="30">system records the decision and notifies customer.</tspan></text>
  <path class="connector" d="M800 1618 V1672"/>
  <rect class="node" x="420" y="1674" width="760" height="118" rx="4"/>
  <text class="nodeText" x="800" y="1733"><tspan x="800" dy="-15">For a confirmed request, record shop readiness</tspan><tspan x="800" dy="30">when the item is ready for the customer visit.</tspan></text>
  <path class="connector" d="M800 1792 V1842"/>
  <polygon class="decision" points="800,1845 1035,1915 800,1985 565,1915"/>
  <text class="nodeText" x="800" y="1915">Was the visit completed?</text>
  <text class="branch" x="820" y="2014">YES</text>
  <path class="connector" d="M800 1985 V2042"/>
  <text class="branch" x="1056" y="1903">NO</text>
  <path class="connector" d="M1035 1915 H1198"/>
  <rect class="card" x="1200" y="1859" width="205" height="112" rx="7"/>
  <text class="small" x="1302" y="1915"><tspan x="1302" dy="-15">Record NO-SHOW</tspan><tspan x="1302" dy="30">when the customer</tspan><tspan x="1302" dy="30">does not attend.</tspan></text>
  <path class="connector" d="M1405 1915 H1410 V2239 H1182"/>
  <rect class="node" x="420" y="2044" width="760" height="94" rx="4"/>
  <text class="nodeText" x="800" y="2091"><tspan x="800" dy="-14">Record COMPLETED / CLAIMED</tspan><tspan x="800" dy="30">after the visit is completed.</tspan></text>
  <path class="connector" d="M800 2138 V2190"/>
  <rect class="node" x="420" y="2192" width="760" height="94" rx="4"/>
  <text class="nodeText" x="800" y="2239"><tspan x="800" dy="-14">Return to the reservation list</tspan><tspan x="800" dy="30">and review the next request.</tspan></text>
  <path class="connector" d="M800 2286 V2904 H1205"/>

  <!-- Catalog management -->
  <rect class="card" x="1450" y="1000" width="820" height="184" rx="10"/>
  <text class="cardTitle" x="1490" y="1042">CATALOG</text>
  <text class="cardText" x="1490" y="1081"><tspan x="1490" dy="0">Search catalog; add a furniture item or edit its product details.</tspan><tspan x="1490" dy="31">Set active/inactive status. Deactivation hides it from browsing</tspan><tspan x="1490" dy="31">and preserves history. Permanent delete is blocked if reservations exist.</tspan></text>

  <!-- Customer management -->
  <rect class="card" x="1450" y="1438" width="820" height="184" rx="10"/>
  <text class="cardTitle" x="1490" y="1480">CUSTOMERS</text>
  <text class="cardText" x="1490" y="1519"><tspan x="1490" dy="0">Search customers by name or email; review account and activity.</tspan><tspan x="1490" dy="31">Activate or deactivate a customer account, then return to the list.</tspan></text>

  <!-- Reports -->
  <rect class="card" x="1450" y="1838" width="820" height="184" rx="10"/>
  <text class="cardTitle" x="1490" y="1880">REPORTS</text>
  <text class="cardText" x="1490" y="1919"><tspan x="1490" dy="0">Choose reservation, recommendation, customer, or furniture report.</tspan><tspan x="1490" dy="31">Apply search/date filters and export results as CSV or PDF.</tspan></text>

  <!-- Privacy audit -->
  <rect class="card" x="1450" y="2278" width="820" height="184" rx="10"/>
  <text class="cardTitle" x="1490" y="2320">PRIVACY AUDIT</text>
  <text class="cardText" x="1490" y="2359"><tspan x="1490" dy="0">Open the privacy audit page and review recorded privacy-related</tspan><tspan x="1490" dy="31">activity for administrative oversight.</tspan></text>

  <!-- API usage -->
  <rect class="card" x="1450" y="2668" width="820" height="184" rx="10"/>
  <text class="cardTitle" x="1490" y="2710">API USAGE</text>
  <text class="cardText" x="1490" y="2749"><tspan x="1490" dy="0">Review AI request usage, budget allowances, and recent alerts.</tspan><tspan x="1490" dy="31">Check provider billing separately when investigating provider charges.</tspan></text>

  <!-- Return from admin sections -->
  <path class="rail" d="M2270 1092 H2320 V2904 M2270 1530 H2320 M2270 1930 H2320 M2270 2370 H2320 M2270 2760 H2320"/>
  <path class="connector" d="M2320 2904 H1208"/>
  <rect class="node" x="420" y="2906" width="785" height="100" rx="4"/>
  <text class="nodeText" x="812" y="2956"><tspan x="812" dy="-14">Finish the selected task;</tspan><tspan x="812" dy="30">return to dashboard or choose another section.</tspan></text>
  <path class="connector" d="M812 3006 V3050"/>
  <polygon class="decision" points="812,3052 1000,3110 812,3168 624,3110"/>
  <text class="nodeText" x="812" y="3110">Is the admin finished?</text>
  <text class="branch" x="602" y="3098" text-anchor="end">NO</text>
  <path class="connector" d="M624 3110 H370 V832 H468"/>
  <text class="branch" x="832" y="3200">YES</text>
  <path class="connector" d="M812 3168 V3231"/>
  <ellipse class="terminal" cx="812" cy="3276" rx="118" ry="45"/>
  <text class="nodeText" x="812" y="3276">END</text>

  <text class="note" x="1200" y="3395">Reservation approval confirms the request; it does not confirm inventory, payment, or physical fit.</text>
  <text class="note" x="1200" y="3427">The shop reviews availability, measurements, visit arrangements, and payment directly with the customer.</text>
  <text class="note" x="1200" y="3459">Only confirmed reservations can be marked ready or closed as completed / claimed or no-show.</text>
</svg>
